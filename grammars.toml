# The grammars every measurement in this repo runs over, pinned.
#
# `upstream/` is gitignored and stays that way. What lives there are clones kept
# for study - tree-sitter, lezer, antlr, gpeg - not sources this package
# vendors, and vendoring a megabyte of somebody else's generated JSON to make a
# dossier reproducible is the wrong trade. But `research/joinery/TESTING.md`
# quotes a number per grammar, and a number whose input exists on one laptop is
# not a result. So the reproducible thing is this file: a repository, a commit,
# a path inside it, and the sha256 of the exact bytes. `tool/grammars.py fetch`
# turns a pin back into a file; `verify` says whether the file on disk is still
# the pinned one, offline.
#
# One exception, and it is the reason `fixture` exists below. `build.zig` embeds
# a grammar into the test module, and a build graph that reads a gitignored path
# cannot be resolved from a clean checkout at all - it fails while checking its
# cache, before compiling a line. So that one grammar is committed at
# `test/grammar/json.json` and the pin it was copied from says so. `verify`
# hashes the committed copy against the pin, which is the only thing keeping the
# two honest. Everything else stays a fetch, and `zig build test` needs none of
# it: the fetch is a prerequisite for the eleven-grammar sweep and nothing else.
#
# Every commit here was checked rather than assumed: the raw file at that
# commit was fetched over the network and its sha256 compared against the bytes
# on disk, and separately its git blob hash was compared inside a real clone.
# All eleven matched their repository's default-branch HEAD on 2026-08-03. A
# grammar whose bytes no upstream commit reproduces would carry
# `commit = "unverified"` and a `note` saying what was found, and `fetch` would
# refuse it rather than guess at a URL - there are none of those today.
#
# Schema: one [[grammar]] table per language, every field required but `note`.
#
#   name    the file `fetch` writes - `<name>.json` under upstream/grammars/
#   repo    GitHub `owner/repo`
#   commit  the 40-hex commit those bytes come from, or the string "unverified"
#   path    where grammar.json sits inside that repository at that commit
#   sha256  sha256 of the exact bytes; this is the authority
#   size    their length, so `list` reads as a table instead of a wall of hashes
#   date    that commit's date, for orientation only
#   note    why a pin is odd, when it is
#   fixture a committed copy of these exact bytes, repo-root-relative. `verify`
#           hashes it against `sha256` and fails naming both paths on a drift.
#           Only for a grammar something in the build graph has to reach without
#           a fetch - one, today.
#
# Adding a grammar means adding a file to research/joinery/corpus/ too, and
# that folder's README explains why it has to be the same program again.

