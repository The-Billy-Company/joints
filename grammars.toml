# The grammars every measurement in this repo runs over, pinned.
#
# `upstream/` is gitignored and stays that way. What lives there are clones kept
# for study - tree-sitter, lezer, antlr, gpeg - not sources this package
# vendors, and vendoring a megabyte of somebody else's generated JSON to make a
# dossier reproducible is the wrong trade. But `research/joinery/TESTING.md`
# quotes a number per grammar, and a number whose input exists on one laptop is
# not a result. So the reproducible thing is this file: a repository, a commit,
# a path inside it, and the sha256 of the exact bytes. `tool/grammars.py fetch`
# turns a pin back into a file; `verify` says whether the file on disk is still
# the pinned one, offline.
#
# One exception, and it is the reason `fixture` exists below. `build.zig` embeds
# a grammar into the test module, and a build graph that reads a gitignored path
# cannot be resolved from a clean checkout at all - it fails while checking its
# cache, before compiling a line. So that one grammar is committed at
# `test/grammar/json.json` and the pin it was copied from says so. `verify`
# hashes the committed copy against the pin, which is the only thing keeping the
# two honest. Everything else stays a fetch, and `zig build test` needs none of
# it: the fetch is a prerequisite for the eleven-grammar sweep and nothing else.
#
# Every commit here was checked rather than assumed: the raw file at that
# commit was fetched over the network and its sha256 compared against the bytes
# on disk, and separately its git blob hash was compared inside a real clone.
# All eleven matched their repository's default-branch HEAD on 2026-08-03. A
# grammar whose bytes no upstream commit reproduces would carry
# `commit = "unverified"` and a `note` saying what was found, and `fetch` would
# refuse it rather than guess at a URL - there are none of those today.
#
# A grammar.json is not always the whole pin, which is what `[[grammar.companion]]`
# is for. ocaml and php are monorepo grammars whose `scanner.c` is a 27- and a
# 17-line shim over a `common/scanner.h` living one or two directories up,
# outside the grammar's own tree - so a pin naming one path cannot describe the
# bytes anyone needs to read, and the lex lane cannot verify what it is
# implementing. A companion carries a path, a sha256 and a size, and is checked
# offline exactly as hard as the grammar is; a companion without its hash is
# refused at load, because a path we fetch and never check is worse than no pin
# at all - it looks like one.
#
# `path` is relative to the REPOSITORY ROOT, the same frame `path` above uses,
# and that is load-bearing rather than tidy. ocaml's `common/scanner.h` is 14,631
# bytes and php's file at the identical path is 18,018 different ones. Resolving
# either against its own scanner's directory - the way an `#include` reads - puts
# both on one path and hands whichever language was built second the other
# repository's scanner. `fetch` writes companions to
# `upstream/grammars/companion/<name>/<path>`, one tree per grammar, so that
# collision is impossible by construction rather than avoided by ordering.
#
# Two sets live here now, and `set` is what tells them apart.
#
# `dossier` is the eleven. Every measurement this repo quotes - the sweep, the
# differential, the reach numbers, the folio sizes in TESTING.md - runs over
# those and only those, and the package was built against them. Adding one
# means adding a file to research/joinery/corpus/ too, and that folder's README
# explains why it has to be the same program again.
#
# `breadth` is a held-out set, and the point of it is that it was chosen before
# any of it was pressed and nothing was tuned against it. Eleven grammars we
# developed against are a training set, so the claim that this presses any
# language is a claim no number in the dossier can support. These nineteen are
# where it holds or stops being a claim. They deliberately do NOT get a corpus
# file: the dossier's discipline is the same program in every language, which is
# what makes those eleven numbers comparable, and it is the wrong instrument
# here - a held-out grammar is asked about a real file from a real project
# instead. Nothing tuned against a breadth grammar should ever be tuned against
# it; the moment one is, it has stopped being held out and belongs in the other
# set.
#
# `load()` defaults to `dossier` for exactly that reason, so widening this file
# cannot widen what an existing sweep measures.
#
# Schema: one [[grammar]] table per language, every field required but `note`,
# `fixture` and `set`.
#
#   name    the file `fetch` writes - `<name>.json` under upstream/grammars/
#   repo    GitHub `owner/repo`
#   commit  the 40-hex commit those bytes come from, or the string "unverified"
#   path    where grammar.json sits inside that repository at that commit
#   sha256  sha256 of the exact bytes; this is the authority
#   size    their length, so `list` reads as a table instead of a wall of hashes
#   date    that commit's date, for orientation only
#   note    why a pin is odd, when it is
#   fixture a committed copy of these exact bytes, repo-root-relative. `verify`
#           hashes it against `sha256` and fails naming both paths on a drift.
#           Only for a grammar something in the build graph has to reach without
#           a fetch - one, today.
#   set     which of the two above; absent means `dossier`.

