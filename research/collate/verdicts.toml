# Hand adjudication — who is actually right where the two parsers disagree
#
# `plumb` scores every disagreement against joints, because the oracle is
# assumed correct. On the two files where tree-sitter's own tree is in recovery
# it goes silent instead, and silence over the corpus's #1 damage row was read
# as a win. This file is the other half: each row is one span, what both trees
# said there, and **which of them is right**, decided by reading the language's
# own grammar rather than by trusting either parser.
#
# `side` is one of:
#   ours     joints is right
#   theirs   tree-sitter is right
#   neither  both are wrong
#   agree    both say the same thing (kept as controls and regression guards)
#   neutral  a declared difference in node shaping that misreads nothing
#
# `ours` and `theirs` are what each tree said **at the moment of adjudication** -
# every node whose extent is exactly `[start, end)`, outermost first, `—` for
# none. `collate.py adjudicated` re-derives both from the live binary and the
# live oracle and reports any row that no longer matches as `DRIFTED`, excluded
# from every total. A hand verdict about a tree that has since changed is not a
# weaker verdict; it is not a verdict.
#
# A drifted row is brought back by **re-judging** it - re-reading the bytes and
# re-deciding `side` - never by pasting today's two names in and leaving `side`
# alone. That shortcut leaves the file asserting one parser is right about a span
# where both now say the same thing, and `collate.py prove` refuses it: on every
# live row, `ours == theirs` must be exactly `side in {agree, neutral}`.
#
# Some drift survives being re-read, and then it gets a `[verdict.drifted]` note:
# what both trees say **now**, the move named, and when it was read. The verdict
# above it stays exactly as judged, and the row still counts toward nothing - a
# note is a record, not a rehabilitation. It exists because the two rows below
# cannot be re-judged into anything true: one lost a node tree-sitter never had,
# so both sides read `—` and the only `side` that would pass `consistent` is
# `agree`, which would file a live regression as two parsers concurring. Writing
# the drift down instead is what keeps the gate readable: `abide` fires on drift
# nobody has read, on a note whose drift has moved again, on a note that misnames
# what it read, and on a note whose row no longer drifts at all - and stops
# firing on the same two rows every run, which is how a gate becomes wallpaper.
#
# Adjudicated 2026-08-05 on pin `collate` (tree 735a2c2ee2e8, binary
# a01fcb3448c4) against tree-sitter 0.26.11 generated from the same pinned
# `grammar.json` the press reads.
#
# Three rows re-judged 2026-08-06 on pin `driftlane` (tree b08566533455) - go
# [43,57) and both php rows, each `theirs` because joints was wrong there and
# each now `agree` because a sibling fixed it. The dissolved witness is kept as
# the regression guard for the fix that dissolved it. **Two verilog rows are left
# drifted on purpose**: [89368,89412) lost a `parameter_declaration` we were right
# about and is a live regression (see below), and [50526,50629) grew an ancestor
# nobody has claimed.

