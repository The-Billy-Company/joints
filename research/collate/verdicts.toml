[[verdict]]  # 'fmt.Print("x")'
grammar = "go"
source = "research/joinery/specimen/go/selector-field.go"
start = 43
end = 57
ours = "expression_statement/call_expression"
theirs = "expression_statement/call_expression"
side = "agree"
why = """
**This was the file's red tripwire, and the parser outgrew it.** `fmt.Print("x")`
is a call. Joints used to read it as a `type_conversion_expression` over a
qualified type - a cast, not a call - while go reported 100.0% standing, zero
damage and zero mends, so every coverage-shaped number here called the file
perfect. The row said in as many words that adjudicating `agree` without somebody
fixing the parser meant the instrument was broken. Somebody fixed the parser.
Bisected over the pins, this span flips between `aud-live` (tree 9d26ca82e78b)
and `heft` (tree 7c07931f6a0b), whose source manifests differ in exactly one
file - `src/kernel/quire/gather.zig`, the `collapse` merge that stopped the fork
budget being spent on several spellings of one derivation. `rack.py` carried the
same tripwire on this same specimen and was re-asked of the corpus for the same
reason. Kept as the regression guard for the fix that dissolved it, not as a win:
the day go reads a call as a conversion again, this row drifts and says so.
Consumer: a call-graph index, or "find all callers of Print"."""

