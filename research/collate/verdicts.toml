**DRIFTED, and left drifted because it is a regression rather than a stale line.**
The bytes are `parameter [31:0] MASKED_IRQ = 32'h 0000_0000`, which A.2.1.1 spells
`parameter_declaration ::= parameter data_type_or_implicit
list_of_param_assignments`. On pin `driftlane` joints builds no node over the
span at all; what it builds instead is `simple_identifier [89368,89377)` over the
word `parameter`, a bare `[`/`constant_range`/`]`, and a
`variable_decl_assignment` over the tail. **That is the keyword read as an
identifier - the exact defect the [80096,80105) row below adjudicates as
tree-sitter's, and that row has not drifted.** Same word, same file, 9 KB apart,
two readings, so this is an inconsistency and not a policy anybody chose.

Attributed: deterministic (six fresh processes, one binary, same answer), so this
is not the press-nondeterminism class. Across thirteen pins the reading tracks
`src/press/bench.zig` - it holds on that file's pre-lane and `unjudged`/`crowdonly`
/`alone2` revisions and is lost on the `bh`/`bonly`/`bhc`/`skeinsonly`/`ship`
revision, which is what shipped - and `src/kernel/quire/gather.zig` can rescue it
at one fuse setting (`crowd64`). The first pin to lose it is `bh`, whose manifest
differs from `heft`'s in `src/press/bench.zig` and `src/press/ladder.zig` only.
That is the `unwritten` change, whose own claim is "costing nothing … no row
moves", measured in `built`/`nodes`/`standing` - counts a node replaced by three
loose siblings over the same bytes cannot move - and whose supporting fuse census
is byte-identical across four corners "without verilog". This row is the verilog
the census left out. Not this lane's file to fix: `bench.zig` is under another
lane right now."""

