# brief singled out: tree-sitter's ERROR is the root, so `plumb` has no verdict
# on any of joints's 30,720 built bytes here.

[[verdict]]  # '#(\n\tparameter [ 0:0] ENABLE_COUNTERS = 1, ...'
grammar = "verilog"
source = "upstream/sources/picorv32.v"
start = 80092
end = 81099
ours = "parameter_port_list"
theirs = "—"
side = "ours"
why = """
The parameter port list of `module picorv32_axi`. A1.4 of the language spells it
`parameter_port_list ::= # ( list_of_param_assignments ... )`, which is exactly
these bytes, and joints fills it out - parameter_port_declaration,
parameter_declaration, packed_dimension, constant_range, integral_number.
tree-sitter has no node over any of it: the deepest thing covering byte 80092 is
the root `ERROR [0,94657)`. Consumer: an editor folding the parameter list, or
expanding a selection outward from one parameter, gets a 1,007-byte region from
joints and the whole file from tree-sitter."""

