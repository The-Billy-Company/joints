# Portable bindings use a separate, matching libjnt. Every native target and
# installed package passes before either registry receives a version upload.
name: release

on:
  push:
    tags: ["v*"]
  # Empty inputs build without publishing. Recovery reuses an existing tag's
  # tested artifacts through this main workflow, without moving the tag.
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing signed tag to finish publishing (empty is a dry run)
        type: string
        default: ""
      artifact_run:
        description: Original tag-triggered release run holding its tested artifacts
        type: string
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  ZIG_VERSION: 0.16.0
  IRREGEX_SHA: 508ad3158efc8346469427e18276f01790c17229
  RUST_VERSION: 1.85.0

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    outputs:
      version: ${{ fromJSON(steps.version.outputs.result).version }}
      tag: ${{ steps.context.outputs.tag }}
      source_sha: ${{ steps.context.outputs.source_sha }}
      artifact_run: ${{ steps.context.outputs.artifact_run }}
      publish: ${{ steps.context.outputs.publish }}
    steps:
      - &control-checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: control
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: context
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ARTIFACT_RUN: ${{ inputs.artifact_run }}
        run: >-
          python3 control/tool/publisher.py release-context
          --release-tag "$RELEASE_TAG" --artifact-run "$ARTIFACT_RUN"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: joints
          ref: ${{ steps.context.outputs.source_sha }}
          persist-credentials: false
      - id: version
        uses: The-Billy-Company/.github/actions/package-release@c5c6bb5aa3c92007f6acdda41dd7fde051ca5736
        with:
          command: version
          args: --root joints
      - if: steps.context.outputs.publish == 'true'
        uses: The-Billy-Company/.github/actions/package-release@c5c6bb5aa3c92007f6acdda41dd7fde051ca5736
        with:
          command: version
          args: --root joints --tag ${{ steps.context.outputs.tag }}
      - uses: The-Billy-Company/.github/actions/package-release@c5c6bb5aa3c92007f6acdda41dd7fde051ca5736
        with:
          command: changelog
          args: >-
            --root joints --require-fragments-empty
            --version ${{ fromJSON(steps.version.outputs.result).version }}
      - run: |
          python3 control/tool/publisher.py --selftest
          python3 -O -m unittest discover -s control/tool -p test_release_finalize.py
      - if: steps.context.outputs.publish == 'true'
        uses: The-Billy-Company/.github/actions/package-release@c5c6bb5aa3c92007f6acdda41dd7fde051ca5736
        with:
          command: tag-ancestor
          args: ${{ github.repository }} ${{ steps.context.outputs.source_sha }} --branch main
      - if: steps.context.outputs.publish == 'true'
        uses: The-Billy-Company/.github/actions/package-release@c5c6bb5aa3c92007f6acdda41dd7fde051ca5736
        with:
          command: ci-status
          args: >-
            ${{ github.repository }} ${{ steps.context.outputs.source_sha }}
            --check-name release-ready --timeout-seconds 3600 --interval-seconds 30
      - if: steps.context.outputs.publish == 'true'
        uses: The-Billy-Company/.github/actions/package-release@c5c6bb5aa3c92007f6acdda41dd7fde051ca5736
        with:
          command: ci-status
          args: >-
            ${{ github.repository }} ${{ github.sha }}
            --check-name release-ready --timeout-seconds 3600 --interval-seconds 30

  native:
    if: needs.preflight.outputs.artifact_run == github.run_id
    name: native (${{ matrix.target }})
    needs: preflight
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x86_64, runner: ubuntu-24.04 }
          - { target: macos-arm64, runner: macos-14 }
    defaults:
      run:
        working-directory: joints
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - &source-checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: joints
          ref: ${{ needs.preflight.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: The-Billy-Company/irregex
          ref: ${{ env.IRREGEX_SHA }}
          path: irregex
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false
      - name: Build and record native artifacts on their actual host
        env:
          TARGET: ${{ matrix.target }}
        run: >-
          python3 tool/release/artifacts.py native --version "$VERSION"
          --target "$TARGET" --irregex-sha "$IRREGEX_SHA" --output dist/native
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.target }}
          path: joints/dist/native/
          if-no-files-found: error

  packages:
    if: needs.preflight.outputs.artifact_run == github.run_id
    needs: [preflight, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: joints
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - *source-checkout
      - &linux-native-in-source
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          run-id: ${{ needs.preflight.outputs.artifact_run }}
          github-token: ${{ github.token }}
          name: native-linux-x86_64
          path: joints/dist/native
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: false
      - name: Install the declared Python and Rust floors
        run: |
          uv python install 3.12
          rustup toolchain install "$RUST_VERSION" --profile minimal
      - name: Build packages and verify the packaged Rust crate
        run: >-
          python3 tool/release/artifacts.py packages --version "$VERSION"
          --native "dist/native/joints-$VERSION-linux-x86_64.tar.gz"
          --python "$(uv python find 3.12)" --rust-toolchain "$RUST_VERSION" --output dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages
          path: |
            joints/dist/python/
            joints/dist/rust/
            joints/dist/packages.json
          if-no-files-found: error

  smoke:
    if: >-
      !cancelled() && needs.preflight.result == 'success' &&
      (needs.native.result == 'success' || needs.native.result == 'skipped') &&
      (needs.packages.result == 'success' || needs.packages.result == 'skipped')
    name: installed packages (${{ matrix.target }})
    needs: [preflight, native, packages]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x86_64, runner: ubuntu-24.04 }
          - { target: macos-arm64, runner: macos-14 }
    defaults:
      run:
        working-directory: joints
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - *control-checkout
      - *source-checkout
      - &packages-in-source
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          run-id: ${{ needs.preflight.outputs.artifact_run }}
          github-token: ${{ github.token }}
          name: packages
          path: joints/dist
      - &target-native-in-source
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          run-id: ${{ needs.preflight.outputs.artifact_run }}
          github-token: ${{ github.token }}
          name: native-${{ matrix.target }}
          path: joints/dist/native
      - name: Verify authenticated original artifacts and source ledgers
        if: needs.preflight.outputs.publish == 'true'
        working-directory: ${{ github.workspace }}
        env: &release-context
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
          ARTIFACT_RUN: ${{ needs.preflight.outputs.artifact_run }}
        run: >-
          python3 control/tool/publisher.py verify-artifacts --release-tag "$TAG"
          --source-sha "$SOURCE_SHA" --artifact-run "$ARTIFACT_RUN"
          --artifact-root joints/dist --source-root joints --native-target ${{ matrix.target }}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: false
      - name: Install the declared Python and Rust floors
        run: |
          uv python install 3.12
          rustup toolchain install "$RUST_VERSION" --profile minimal
      - name: Parse, query, refuse malformed input, and prove ownership on installed packages
        env:
          TARGET: ${{ matrix.target }}
        run: >-
          python3 tool/release/artifacts.py verify --version "$VERSION"
          --native "dist/native/joints-$VERSION-$TARGET.tar.gz" --packages dist
          --python "$(uv python find 3.12)" --rust-toolchain "$RUST_VERSION"

  registry-probes:
    if: >-
      !cancelled() && needs.preflight.outputs.publish == 'true' && needs.preflight.result == 'success' && needs.smoke.result == 'success'
    needs: [preflight, smoke]
    runs-on: ubuntu-24.04
    outputs:
      pypi: ${{ steps.pypi.outputs.result }}
      crates: ${{ steps.crates.outputs.result }}
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - *control-checkout
      - *source-checkout
      - &packages-in-workspace
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          run-id: ${{ needs.preflight.outputs.artifact_run }}
          github-token: ${{ github.token }}
          name: packages
          path: dist
      - name: Verify authenticated original artifacts and source ledgers
        if: needs.preflight.outputs.publish == 'true'
        working-directory: ${{ github.workspace }}
        env: *release-context
        run: >-
          python3 control/tool/publisher.py verify-artifacts --release-tag "$TAG"
          --source-sha "$SOURCE_SHA" --artifact-run "$ARTIFACT_RUN"
          --artifact-root dist --source-root joints
      - id: pypi
        uses: The-Billy-Company/.github/actions/package-release@c5c6bb5aa3c92007f6acdda41dd7fde051ca5736
        with:
          command: registry-probe
          args: pypi joints ${{ env.VERSION }}
      - id: crates
        uses: The-Billy-Company/.github/actions/package-release@c5c6bb5aa3c92007f6acdda41dd7fde051ca5736
        with:
          command: registry-probe
          args: crates joints ${{ env.VERSION }}
      # A present version is only a successful retry when the public index and
      # downloaded bytes agree with every artifact this build tested.
      - name: Refuse versions that already publish different bytes
        run: python3 joints/tool/release/artifacts.py probe --version "$VERSION" --packages dist

  auth-crates:
    if: >-
      !cancelled() && needs.preflight.outputs.publish == 'true' && needs.preflight.result == 'success' && needs.registry-probes.result == 'success' && needs.registry-probes.outputs.crates == 'absent'
    needs: [preflight, registry-probes]
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      # The action's post step revokes this readiness token. Publishers obtain
      # fresh tokens only after both registries have accepted the identity.
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

  auth-pypi:
    # The crates identity is checked first: PyPI may create a pending project
    # during minting. Readiness never uploads a version and burns its token.
    if: >-
      !cancelled() && needs.preflight.outputs.publish == 'true' &&
      needs.preflight.result == 'success' && needs.registry-probes.result == 'success' &&
      (needs.auth-crates.result == 'success' || needs.auth-crates.result == 'skipped') &&
      needs.registry-probes.outputs.pypi == 'absent'
    needs: [preflight, registry-probes, auth-crates]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - *control-checkout
      - *source-checkout
      - name: Mint and burn a PyPI credential without uploading
        env: *release-context
        run: |
          python3 control/tool/publisher.py assert-context --release-tag "$TAG" --source-sha "$SOURCE_SHA" --artifact-run "$ARTIFACT_RUN"
          python3 control/tool/publisher.py pypi-readiness --source-root joints --release-tag "$TAG" --source-sha "$SOURCE_SHA"

  publish-python:
    if: >-
      !cancelled() && needs.preflight.outputs.publish == 'true' &&
      needs.preflight.result == 'success' && needs.registry-probes.result == 'success' &&
      (needs.auth-crates.result == 'success' || needs.auth-crates.result == 'skipped') &&
      (needs.auth-pypi.result == 'success' || needs.auth-pypi.result == 'skipped')
    needs: [preflight, registry-probes, auth-crates, auth-pypi]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - *control-checkout
      - *source-checkout
      - *packages-in-workspace
      - name: Verify original source and payload bytes immediately before upload
        env: *release-context
        run: >-
          python3 control/tool/publisher.py verify-artifacts --release-tag "$TAG"
          --source-sha "$SOURCE_SHA" --artifact-run "$ARTIFACT_RUN"
          --artifact-root dist --source-root joints
      - if: needs.registry-probes.outputs.pypi == 'absent'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/python/

  publish-rust:
    if: >-
      !cancelled() && needs.preflight.outputs.publish == 'true' &&
      needs.preflight.result == 'success' && needs.registry-probes.result == 'success' &&
      (needs.auth-crates.result == 'success' || needs.auth-crates.result == 'skipped') &&
      (needs.auth-pypi.result == 'success' || needs.auth-pypi.result == 'skipped')
    needs: [preflight, registry-probes, auth-crates, auth-pypi]
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - *control-checkout
      - *source-checkout
      - *packages-in-source
      - *linux-native-in-source
      - if: needs.registry-probes.outputs.crates == 'absent'
        name: Install the declared Rust floor
        run: rustup toolchain install "$RUST_VERSION" --profile minimal
      - if: needs.registry-probes.outputs.crates == 'absent'
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Verify original source and payload bytes immediately before upload
        env: *release-context
        run: >-
          python3 control/tool/publisher.py verify-artifacts --release-tag "$TAG"
          --source-sha "$SOURCE_SHA" --artifact-run "$ARTIFACT_RUN"
          --artifact-root joints/dist --source-root joints --native-target linux-x86_64
      - if: needs.registry-probes.outputs.crates == 'absent'
        name: Publish only the crate bytes the build verified
        working-directory: joints
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: >-
          python3 tool/release/artifacts.py publish-crate --version "$VERSION"
          --native "dist/native/joints-$VERSION-linux-x86_64.tar.gz" --packages dist
          --rust-toolchain "$RUST_VERSION"

  public-index:
    name: public index (${{ matrix.target }})
    if: >-
      !cancelled() && needs.preflight.outputs.publish == 'true' && needs.preflight.result == 'success' && needs.publish-python.result == 'success' && needs.publish-rust.result == 'success'
    needs: [preflight, publish-python, publish-rust]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x86_64, runner: ubuntu-24.04 }
          - { target: macos-arm64, runner: macos-14 }
    defaults:
      run:
        working-directory: joints
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - *control-checkout
      - *source-checkout
      - *packages-in-source
      - *target-native-in-source
      - name: Verify authenticated original artifacts and source ledgers
        if: needs.preflight.outputs.publish == 'true'
        working-directory: ${{ github.workspace }}
        env: *release-context
        run: >-
          python3 control/tool/publisher.py verify-artifacts --release-tag "$TAG"
          --source-sha "$SOURCE_SHA" --artifact-run "$ARTIFACT_RUN"
          --artifact-root joints/dist --source-root joints --native-target ${{ matrix.target }}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: false
      - name: Install the declared Python and Rust floors
        run: |
          uv python install 3.12
          rustup toolchain install "$RUST_VERSION" --profile minimal
      - name: Download indexed artifacts, compare hashes, and repeat the installed proof
        env:
          TARGET: ${{ matrix.target }}
        run: >-
          python3 tool/release/artifacts.py registry --version "$VERSION"
          --native "dist/native/joints-$VERSION-$TARGET.tar.gz" --packages dist
          --python "$(uv python find 3.12)" --rust-toolchain "$RUST_VERSION"

  github-release:
    if: >-
      !cancelled() && needs.preflight.outputs.publish == 'true' && needs.preflight.result == 'success' && needs.public-index.result == 'success'
    needs: [preflight, public-index]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      TAG: ${{ needs.preflight.outputs.tag }}
      SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
      ARTIFACT_RUN: ${{ needs.preflight.outputs.artifact_run }}
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - *control-checkout
      - *source-checkout
      - *packages-in-workspace
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          run-id: ${{ needs.preflight.outputs.artifact_run }}
          github-token: ${{ github.token }}
          pattern: native-*
          path: dist/native
          merge-multiple: true
      - uses: The-Billy-Company/.github/actions/package-release@c5c6bb5aa3c92007f6acdda41dd7fde051ca5736
        with:
          command: notes
          args: >-
            --root joints --version ${{ env.VERSION }} --out ${{ runner.temp }}/release-notes.md
            --repo ${{ github.repository }}
      - name: Attach verified original assets and finalize their curated release
        env:
          NOTES: ${{ runner.temp }}/release-notes.md
        run: >-
          python3 control/tool/release_finalize.py --tag "$TAG" --source-sha "$SOURCE_SHA"
          --artifact-run "$ARTIFACT_RUN" --version "$VERSION" --source-root joints
          --packages dist --native-directory dist/native --notes "$NOTES"
