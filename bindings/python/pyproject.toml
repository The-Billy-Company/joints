# The Python interface uses ctypes over a separately supplied libjnt.
# Native archives are distributed separately from the portable Python package.

[build-system]
requires = [ "hatchling>=1.27" ]
build-backend = "hatchling.build"

[project]
name = "joints"
version = "0.1.0" # x-release-please-version
# Says what the project is, then what this version is not, in that order. PyPI
# renders this line in search results where a caveat further down never reaches
# the reader deciding whether to install.
description = "Experimental parsing and structural queries over grammar data, with Python bindings to libjnt."
readme = "README.md"
# Not caution, and not the eventual binding's floor discovered by testing: it is
# the floor the sibling packages hold, and admitting interpreters this project
# will not test against is a promise nobody here intends to keep. It can only
# move down later, which is the harmless direction.
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = [ "LICENSE", "NOTICE" ]
authors = [ { name = "The Billy Company" } ]
# PyPI scores name, summary and keywords together, so these are the words
# somebody types when they have the problem this solves rather than a
# restatement of the name.
keywords = [ "parser", "parsing", "incremental", "tree-sitter", "cst", "syntax-tree" ]
classifiers = [
  # This interface is experimental; native distribution is still separate.
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: General",
]
# The engine is Zig; the interface is Python and ships no native binary yet.
# No `License ::` classifier: the SPDX `license` field above is PEP 639
# metadata, and the two spellings together are an error in current tooling
# rather than a belt and braces.

[project.urls]
Homepage = "https://github.com/The-Billy-Company/joints"
Source = "https://github.com/The-Billy-Company/joints"
Documentation = "https://github.com/The-Billy-Company/joints/blob/main/bindings/python/README.md"
Changelog = "https://github.com/The-Billy-Company/joints/blob/main/CHANGELOG.md"
Issues = "https://github.com/The-Billy-Company/joints/issues"

[tool.hatch.build.targets.wheel]
packages = [ "joints" ]

[tool.hatch.build.targets.sdist]
# Explicit rather than "whatever is in the directory", so a stray virtualenv or
# a build cache cannot ride along into a published artifact.
include = [ "joints", "README.md", "LICENSE", "NOTICE", "pyproject.toml" ]
