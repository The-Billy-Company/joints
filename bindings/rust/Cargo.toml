# Its own workspace root, deliberately. The crate has to lift out of this
# repository as a standalone package, and an empty `[workspace]` table means a
# Cargo.toml appearing above it later cannot silently absorb it and take over
# its lockfile and lint configuration.
[workspace]

[package]
# `joints`, spelled out. The C symbol prefix is `jnt_` and the shared library is
# `libjnt`, so the short form would have agreed with them - but `jnt` is already
# taken on the index and crate names are permanent, so it was never available.
# `joints` was, which is the better outcome anyway: the registry entry is the one
# surface a stranger reads first, and it should be a word.
name = "joints"
version = "0.1.0" # x-release-please-version
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
# The description says what the project is and then says what this version is
# not, in that order, because crates.io shows it in search results where there
# is no room for a caveat further down. A reader deciding whether to depend on
# this needs the second sentence more than the first.
description = "Experimental safe Rust binding to libjnt: parsing, repair confidence, tree traversal, and in-process queries. Requires a separately built native library."
links = "jnt"
build = "build.rs"
readme = "README.md"
homepage = "https://github.com/The-Billy-Company/joints"
repository = "https://github.com/The-Billy-Company/joints"
documentation = "https://github.com/The-Billy-Company/joints/blob/main/bindings/rust/README.md"
authors = [ "The Billy Company" ]
# crates.io allows five keywords, so each has to earn its slot. `parser` and
# `parsing` are both here because the category is searched under both spellings;
# `incremental` and `tree-sitter` are what somebody types when they have the
# problem this is the answer to; `cst` is the output nobody else in this
# category names.
keywords = [ "parser", "parsing", "incremental", "tree-sitter", "cst" ]
categories = [ "parsing", "text-processing", "development-tools" ]
# Apache-2.0 section 4 wants the license text travelling with the copy, so the
# files ship rather than resting on the SPDX identifier alone.
include = [ "/src", "/build.rs", "/tests", "/README.md", "/LICENSE", "/NOTICE" ]

[lib]
path = "src/lib.rs"

[lints.rust]
# Keep the standalone package as strict as the native workspace. Group lints
# run first so an individual, documented exception cannot weaken other checks.
warnings = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
missing_docs = "deny"
elided_lifetimes_in_paths = "deny"
improper_ctypes = "deny"
improper_ctypes_definitions = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unreachable_pub = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
unused_qualifications = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
as_ptr_cast_mut = "deny"
cast_lossless = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_precision_loss = "deny"
cast_ptr_alignment = "deny"
cast_sign_loss = "deny"
checked_conversions = "deny"
clone_on_ref_ptr = "deny"
fn_to_numeric_cast_any = "deny"
implicit_clone = "deny"
missing_safety_doc = "deny"
ptr_as_ptr = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
redundant_type_annotations = "deny"
ref_as_ptr = "deny"
ref_option_ref = "deny"
transmute_ptr_to_ref = "deny"
undocumented_unsafe_blocks = "deny"
unneeded_field_pattern = "deny"
